<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Phase 2 design wireframe for Burning Arktis; not the public website.">
<title>Burning Arktis | Phase 2 Wireframe (Review Only)</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0a0e13; --surface: #101820; --surface2: #17222c; --ink: #edf4f7;
  --muted: #aabcc5; --line: #344852; --accent: #59d6e5; --amber: #f1bb6b;
  --radius: 2px; --max: 1160px;
  font-family: Inter, "Segoe UI", "Noto Sans", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); line-height: 1.6; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
::selection { background: var(--accent); color: #071219; }
.shell { width: min(var(--max), calc(100% - 56px)); margin-inline: auto; }
.review-bar { background: #203039; border-bottom: 1px solid #435761; font-size: .7rem; letter-spacing: .15em; font-weight: 700; }
.review-bar .shell { display: flex; flex-wrap: wrap; gap: 10px 26px; align-items: center; justify-content: space-between; padding-block: 9px; }
.review-bar strong { color: var(--accent); font-weight: 800; }
.review-bar span { color: #c5d0d7; }
.site-header { border-bottom: 1px solid var(--line); background: #0a0e13ee; position: sticky; top: 0; z-index: 30; backdrop-filter: blur(10px); }
.head-row { min-height: 90px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.wordmark { display: inline-flex; align-items: center; gap: 14px; line-height: .99; font-weight: 900; letter-spacing: .13em; font-size: .91rem; }
.logo-shape { display: block; flex: none; width: 34px; height: 38px; border: 3px solid var(--accent); clip-path: polygon(50% 0, 100% 28%, 100% 76%, 50% 100%, 0 76%, 0 28%); background: repeating-linear-gradient(135deg, #59d6e533, #59d6e533 3px, transparent 3px, transparent 8px); }
.brand-pair { display: grid; gap: 3px; }
.brand-pair b { color: var(--accent); font-weight: 900; }
.nav { display: flex; gap: 7px; }
.nav a { min-width: 93px; text-align: center; padding: 10px 19px; border: 1px solid transparent; color: var(--muted); font-size: .83rem; font-weight: 750; }
.nav a:hover, .nav a[aria-current="page"] { color: var(--accent); border-color: var(--line); background: var(--surface); }
.eyebrow, .overline { text-transform: uppercase; color: var(--accent); font-weight: 800; letter-spacing: .22em; font-size: .72rem; }
.muted { color: var(--muted); }
.page { animation: in .2s ease-out; }
@keyframes in { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.hero { padding: clamp(60px, 9vw, 122px) 0 90px; display: grid; grid-template-columns: minmax(0,1.12fr) minmax(320px,.88fr); gap: 7%; align-items: center; }
.hero h1 { max-width: 830px; font-size: clamp(2.8rem, 6vw, 6.2rem); line-height: 1.04; letter-spacing: -.064em; margin: 23px 0 26px; font-weight: 900; }
.hero h1 em { color: var(--accent); font-style: normal; }
.hero .lead { max-width: 475px; font-size: 1.05rem; color: #c4d2d9; }
.button-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 13px 20px; font-size: .84rem; font-weight: 800; line-height: 1.1; min-height: 46px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: var(--radius); }
.btn.primary { background: var(--accent); color: #061218; border-color: var(--accent); }
.btn:hover { border-color: var(--accent); }
.btn.primary:hover { background: #9beef4; }
.stage { position: relative; overflow: hidden; background: radial-gradient(ellipse at 70% 10%, #21536599 0, transparent 36%), linear-gradient(130deg, #172a35, #0c141d 70%); min-height: 350px; border: 1px solid #42515d; }
.stage:before { content: ""; position: absolute; inset: 0; opacity: .31; background-image: linear-gradient(#76d0dd22 1px, transparent 1px), linear-gradient(90deg,#76d0dd22 1px,transparent 1px); background-size: 33px 33px; }
.stage:after { content: ""; position: absolute; width: 57%; aspect-ratio: 1; border: 3px solid #75dcea; left: 22%; top: 12%; transform: rotate(25deg); box-shadow: 0 0 0 34px #4ba9b413, 0 0 0 67px #4ba9b40c; }
.stage-label { position: absolute; z-index: 1; top: 19px; left: 22px; color: #9ac9d1; font-size: .67rem; letter-spacing: .19em; text-transform: uppercase; }
.stage-foot { position: absolute; z-index: 1; inset: auto 20px 20px; display: flex; justify-content: space-between; gap: 8px; font-size: .68rem; font-weight: 800; color: #b6dbe1; letter-spacing: .14em; text-transform: uppercase; }
.divider { border: 0; border-top: 1px solid var(--line); margin: 0; }
.section { padding-block: clamp(70px, 8vw, 110px); }
.section-heading { display: flex; gap: 24px; align-items: end; justify-content: space-between; margin-bottom: 28px; }
.section h2, .page-title { margin: 8px 0 0; line-height: 1.07; letter-spacing: -.045em; font-size: clamp(2rem, 4vw, 3.8rem); }
.section p { max-width: 690px; }
.link { color: var(--accent); text-decoration: underline; text-underline-offset: 5px; }
.featured { display: grid; grid-template-columns: 1.14fr .86fr; border: 1px solid var(--line); background: var(--surface); }
.featured .stage { min-height: 350px; border: 0; border-right: 1px solid var(--line); }
.featured-body { padding: clamp(25px, 4vw, 52px); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
.featured h3 { font-size: clamp(1.8rem,3.3vw,3rem); letter-spacing: -.04em; line-height: 1.1; margin: 16px 0; }
.featured p { color: var(--muted); }
.meta { font-size: .7rem; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
.two-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.info-panel { border-top: 2px solid var(--line); padding: 28px 10px 16px 0; }
.info-panel h3 { font-size: clamp(1.45rem,2vw,2rem); letter-spacing: -.035em; margin: 10px 0; }
.info-panel p { color: var(--muted); max-width: 480px; }
.site-footer { border-top: 1px solid var(--line); padding-block: 33px 54px; }
.foot-row { display: flex; flex-wrap: wrap; gap: 22px; align-items: center; justify-content: space-between; font-size: .79rem; color: var(--muted); }
.foot-links { display: flex; flex-wrap: wrap; gap: 20px; }
.foot-links a:hover { color: var(--accent); }
.page-top { padding: 75px 0 35px; }
.page-top .intro { max-width: 700px; color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 25px; }
.filter-row { display: flex; gap: 9px; flex-wrap: wrap; }
.chip { padding: 10px 15px; background: var(--surface); border: 1px solid var(--line); color: #c0cdd3; font-size: .76rem; font-weight: 800; letter-spacing: .03em; min-height: 43px; }
.chip[aria-pressed="true"] { background: var(--accent); color: #09151c; border-color: var(--accent); }
.review-toggle { min-height: 43px; padding: 9px 14px; border: 1px dashed #b18555; color: var(--amber); background: transparent; font-weight: 750; font-size: .75rem; }
.warning { color: var(--amber); }
.notice { padding: 15px 18px; border-left: 3px solid var(--amber); background: #2b251f; color: #e7cda5; font-size: .85rem; margin: 0 0 28px; }
.work-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 17px; }
.work-card { min-width: 0; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; }
.work-card.candidate { border-style: dashed; border-color: #77604a; }
.work-card .stage { min-height: 235px; border: 0; border-bottom: 1px solid var(--line); }
.work-card .stage:after { width: 47%; left: 27%; top: 11%; }
.work-card .stage-foot { color: #c7d9df; }
.work-card .card-content { padding: 23px; display: flex; flex-direction: column; flex: 1; }
.tag { display: inline-block; font-size: .65rem; letter-spacing: .12em; font-weight: 900; text-transform: uppercase; color: var(--accent); }
.tag.review { color: var(--amber); }
.work-card h2 { font-size: 1.52rem; letter-spacing: -.025em; line-height: 1.13; margin: 15px 0 5px; }
.work-card p { color: var(--muted); font-size: .89rem; margin: 12px 0 22px; }
.card-link { margin-top: auto; font-weight: 800; font-size: .82rem; color: var(--accent); }
.card-link:hover { text-decoration: underline; }
.work-card.candidate .card-link { color: var(--amber); }
.empty { border: 1px dashed var(--line); padding: 38px; color: var(--muted); }
.small-note { color: var(--muted); font-size: .8rem; }
.detail-back { display: inline-block; color: var(--accent); margin-top: 35px; font-weight: 800; font-size: .78rem; }
.detail-head { display: flex; align-items: end; justify-content: space-between; gap: 28px; padding: 46px 0 30px; }
.detail-head h1 { font-size: clamp(2.8rem,5.8vw,5.7rem); letter-spacing: -.06em; line-height: 1.02; margin: 12px 0; }
.detail-head .muted { max-width: 590px; }
.detail-cta { flex: none; display: flex; gap: 10px; flex-wrap: wrap; align-self: center; }
.detail-cta .btn { min-width: 145px; }
.detail .stage { min-height: 460px; }
.detail .stage:after { width: 31%; left: 35%; top: 16%; }
.detail-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: clamp(36px,7vw,110px); padding: 63px 0 90px; }
.detail-grid h2 { font-size: 1.95rem; margin: 8px 0; letter-spacing: -.03em; }
.detail-grid p { color: var(--muted); }
.facts { margin: 0; border-top: 1px solid var(--line); }
.facts div { display: grid; grid-template-columns: 106px 1fr; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.facts dt { color: var(--muted); font-size: .76rem; }
.facts dd { margin: 0; font-size: .82rem; font-weight: 650; }
.external-links { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 26px; }
.note-footer { padding: 20px 0 60px; font-size: .8rem; color: var(--muted); }
@media (max-width: 900px) {
 .hero { grid-template-columns: 1fr; gap: 38px; padding-block: 62px; }
 .hero .stage { min-height: 330px; }
 .work-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
 .featured { grid-template-columns: 1fr; }
 .featured .stage { border: 0; border-bottom: 1px solid var(--line); }
 .detail-grid { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
 .shell { width: calc(100% - 32px); }
 .head-row { min-height: 73px; }
 .wordmark { font-size: .69rem; letter-spacing: .08em; gap: 9px; }
 .logo-shape { width: 27px; height: 30px; }
 .nav a { min-width: 0; padding: 9px 10px; }
 .review-bar .shell { gap: 2px; padding-block: 7px; }
 .review-bar span { font-size: .61rem; }
 .hero h1 { font-size: clamp(2.6rem,12vw,4.3rem); }
 .hero .stage { min-height: 265px; }
 .section { padding-block: 64px; }
 .section-heading { align-items: start; }
 .two-cols,.work-grid { grid-template-columns: 1fr; }
 .page-top { padding-top: 55px; }
 .controls { align-items: stretch; }
 .filter-row { gap: 6px; }
 .chip { padding-inline: 11px; }
 .detail-head { display: block; }
 .detail-cta { margin-top: 25px; }
 .detail-cta .btn { width: 100%; }
 .detail .stage { min-height: 300px; }
 .facts div { grid-template-columns: 90px 1fr; }
 .work-card .stage { min-height: 240px; }
}
@media (prefers-reduced-motion:reduce) {
 *,*:before,*:after { scroll-behavior:auto !important; animation:none !important; transition:none !important; }
}
</style>
</head>
<body>
<div class="review-bar"><div class="shell"><strong>PHASE 02 / DESIGN REVIEW</strong><span>LOCAL WIREFRAME — NOT THE PUBLISHED WEBSITE</span></div></div>
<header class="site-header"><div class="shell head-row">
  <a class="wordmark" href="#home" aria-label="Burning Arktis Home"><span class="logo-shape" aria-hidden="true"></span><span class="brand-pair">BURNING <b>ARKTIS</b></span></a>
  <nav class="nav" aria-label="Primary"><a href="#home" id="nav-home">Home</a><a href="#works" id="nav-works">Works</a></nav>
</div></header>
<main id="app" tabindex="-1"><div class="shell" style="padding:90px 0">Design preview requires JavaScript enabled.</div></main>
<footer class="site-footer"><div class="shell foot-row">
  <div>© 2026 BURNING ARKTIS <span class="muted">/ Design study</span></div>
  <div class="foot-links"><a href="https://arktis-p.github.io/privacy.html" target="_blank" rel="noopener noreferrer">Anvil Bastion Privacy</a><a href="mailto:burningarktis@proton.me">Contact</a><a href="https://github.com/Arktis-P" target="_blank" rel="noopener noreferrer">GitHub ↗</a></div>
</div></footer>
<script>
(function () {
  "use strict";
  // STATIC DEMONSTRATION DATA ONLY. Do not reuse the two candidates as production content.
  var works = [
    {
      slug:"anvil-bastion",title:"Anvil Bastion",category:"game",categoryLabel:"Game",number:"01",
      desc:"A mobile defense and progression game.",review:false,
      status:"Google Play listing verified",author:"Team Burning Arktis (Google Play developer)",
      detail:"Google Play lists Anvil Bastion: Idle Defense as a Team Burning Arktis game. Forge equipment, improve your builds, and defend the Bastion. Approved artwork has not yet been imported into this wireframe.",
      links:[{label:"Google Play",href:"https://play.google.com/store/apps/details?id=com.burningarktis.anvilbastion",primary:true},{label:"Privacy Policy",href:"https://arktis-p.github.io/privacy.html"},{label:"Support",href:"mailto:burningarktis@proton.me"}]
    },
    {
      slug:"virtualqhdmirror",title:"VirtualQHDMirror",category:"software",categoryLabel:"Software",number:"02",
      desc:"An interactive window onto a higher-resolution virtual desktop.",review:false,
      status:"Public GitHub software · portfolio inclusion approved",author:"Public Arktis-P repository (studio release attribution not claimed)",
      detail:"A Windows 11 tool for interacting with a higher-resolution virtual desktop from a lower-resolution display. The website owner has approved listing the public software in Works; the GitHub README contains details and release information.",
      links:[{label:"GitHub",href:"https://github.com/Arktis-P/VirtualQHDMirror/blob/main/README.md",primary:true}]
    },
    {
      slug:"spartapixelverse",title:"SpartaPixelVerse",category:"experiment",categoryLabel:"Experiment",number:"03",
      desc:"A Unity learning project featuring interaction and small minigames.",review:true,
      status:"Review only · individual bootcamp exercise",author:"Individual educational project (per public README)",
      detail:"Its public README describes an individual Unity bootcamp assignment. This is NOT represented as a studio production or a commercial release. It appears here to demonstrate a third category and must be approved explicitly before any public portfolio inclusion.",
      links:[{label:"Public README ↗",href:"https://github.com/Arktis-P/SpartaPixelVerse/blob/main/README.md"}]
    }
  ];
  var category = "all";
  var showCandidates = false;
  var app = document.getElementById("app");
  function stage(label,num,kind) {
    return '<div class="stage" aria-label="Abstract art placeholder, not an actual project screenshot" role="img"><span class="stage-label">' + label + '</span><div class="stage-foot"><span>VISUAL PLACEHOLDER</span><span>' + (num || "BA / 02") + '</span></div></div>';
  }
  function home() {
    return '<div class="shell page"><section class="hero"><div><span class="eyebrow">Games / software / creative experiments</span><h1>Making things<br>worth <em>exploring.</em></h1><p class="lead">Burning Arktis creates and explores interactive projects. Discover the work and find the right place for support.</p><div class="button-row"><a class="btn primary" href="#works">Explore Works <span aria-hidden="true">↗</span></a></div></div>' +
       stage("BRAND / IMAGE SLOT","CONCEPT 01") + '</section></div><hr class="divider"><div class="shell page">' +
       '<section class="section"><div class="section-heading"><div><span class="overline">Selected work</span><h2>Featured Project</h2></div><a class="link" href="#works">All works →</a></div><div class="featured">' +
       stage("APPROVED ART NEEDED","FEATURED") + '<div class="featured-body"><span class="tag">GAME / EXISTING PUBLIC SITE</span><h3>Anvil Bastion</h3><p>A mobile defense and progression game. Existing developer and support information is retained in this concept.</p><a class="btn primary" href="#work/anvil-bastion">View project →</a></div></div></section>' +
       '<section class="section two-cols" id="about"><div class="info-panel"><span class="overline">About us</span><h3>Independent by design.</h3><p>We make games and explore useful software and interactive experiments. More detailed studio history will be published only after verification.</p></div>' +
       '<div class="info-panel"><span class="overline">Contact & support</span><h3>Get in touch.</h3><p>For Anvil Bastion and other inquiries, use the verified contact email.</p><a class="link" href="mailto:burningarktis@proton.me">burningarktis@proton.me ↗</a></div></section></div>';
  }
  function card(w) {
    return '<article class="work-card' + (w.review?' candidate':'') + '">' +
      stage(w.review?"REVIEW-ONLY EXAMPLE":"COVER ART PENDING",w.number) +
      '<div class="card-content"><span class="tag' + (w.review?' review':'') + '">' + (w.review?"REVIEW ONLY / ":"") + w.categoryLabel + '</span><h2>' + w.title + '</h2>' +
      '<span class="meta">' + w.status + '</span><p>' + w.desc + '</p><a class="card-link" href="#work/' + w.slug + '" aria-label="Open ' + w.title + ' project detail">View detail →</a></div></article>';
  }
  function worksPage() {
    var data = works.filter(function(w){return (showCandidates || !w.review) && (category === "all" || w.category === category);});
    var filters = [["all","All"],["game","Games"],["software","Software"],["experiment","Experiments"]].map(function(x){
      return '<button type="button" class="chip" data-filter="' + x[0] + '" aria-pressed="' + (x[0]===category) + '">' + x[1] + '</button>';
    }).join("");
    var cards = data.length ? '<div class="work-grid">' + data.map(card).join("") + '</div>' :
      '<div class="empty">No work in this category in the selected review mode. Pending candidates are never assumed published.</div>';
    return '<div class="shell page"><div class="page-top"><span class="overline">Selected portfolio</span><h1 class="page-title">Our Works<span style="color:var(--accent)">.</span></h1>' +
      '<p class="intro">Games, software and experiments. Initial works include Anvil Bastion and VirtualQHDMirror; review-only examples stay separate.</p></div>' +
      '<div class="controls"><div class="filter-row" role="group" aria-label="Work categories">' + filters + '</div>' +
      '<button type="button" class="review-toggle" id="toggle-candidates" aria-pressed="' + showCandidates + '">' + (showCandidates?'Hide':'Show') + ' review-only examples</button></div>' +
      (showCandidates?'<div class="notice"><strong>Design-only candidates:</strong> dashed amber cards are public GitHub projects included to test the layout. They are NOT approved team works or production entries.</div>':'<div class="notice">Initial public selection: Anvil Bastion and VirtualQHDMirror. Other projects remain excluded.</div>') +
      cards + '<div class="note-footer">This is a Phase 2 wireframe. The Google Play URL is verified. Unapproved artwork and unverified affiliation claims are excluded.</div></div>';
  }
  function details(slug) {
    var w=works.find(function(x){return x.slug===slug;});
    if(!w)return '<div class="shell page" style="padding-block:90px"><h1>Work not found</h1><a class="link" href="#works">Back to Works →</a></div>';
    function action(x){return '<a class="btn' + (x.primary?' primary':'') + '" href="' + x.href + '"' + (x.href.indexOf("https://")===0?' target="_blank" rel="noopener noreferrer"':'') + '>' + x.label + (x.primary?' ↗':'') + '</a>';}
    var primary = w.links.filter(function(x){return x.primary;}).map(action).join("");
    var items = w.links.filter(function(x){return !x.primary;}).map(action).join("");
    return '<div class="shell page detail"><a class="detail-back" href="#works">← Back to Works</a>' +
      (w.review?'<div class="notice" style="margin-top:24px">REVIEW ONLY — this project has not been approved for publication as a Burning Arktis studio work.</div>':'') +
      '<div class="detail-head"><div><span class="overline">' + (w.review?'Review-only example':'Portfolio work') + ' / ' + w.categoryLabel + '</span><h1>' + w.title + '</h1><p class="muted">' + w.desc + '</p></div>' + (primary?'<div class="detail-cta" aria-label="Official project links">' + primary + '</div>':'') + '</div>' +
      stage("IMAGE / SCREENSHOT SLOT",w.number) +
      '<section class="detail-grid"><div><span class="overline">Overview</span><h2>About this work</h2><p>' + w.detail + '</p></div>' +
      '<aside><span class="overline">Project facts</span><dl class="facts"><div><dt>Category</dt><dd>' + w.categoryLabel + '</dd></div><div><dt>Attribution</dt><dd>' + w.author + '</dd></div><div><dt>Visibility</dt><dd>' + w.status + '</dd></div></dl>' +
      (items?'<div class="meta" style="margin-top:26px">Related links</div><div class="external-links">' + items + '</div>':'') + '</aside></section></div>';
  }
  function render() {
    var hash=(location.hash||"#home").slice(1);
    var page=hash==="works"?"works":hash.indexOf("work/")===0?"detail":"home";
    app.innerHTML=page==="home"?home():page==="works"?worksPage():details(hash.slice(5));
    document.getElementById("nav-home").setAttribute("aria-current",page==="home"?"page":"false");
    document.getElementById("nav-works").setAttribute("aria-current",page==="home"?"false":"page");
    document.title=(page==="home"?"Home":page==="works"?"Works":"Work Detail")+" | Burning Arktis — Wireframe Review";
    window.scrollTo(0,0);
  }
  app.addEventListener("click",function(ev){
    var filter=ev.target.closest("[data-filter]");
    if(filter){category=filter.getAttribute("data-filter");render();return;}
    var toggle=ev.target.closest("#toggle-candidates");
    if(toggle){showCandidates=!showCandidates;render();}
  });
  window.addEventListener("hashchange",render);
  render();
})();
</script>
</body>
</html>
